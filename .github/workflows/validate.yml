name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter and README.md linkage
        run: |
          set -euo pipefail

          if [ ! -f SKILL.md ]; then
            echo "FAIL: SKILL.md not found"
            exit 1
          fi

          NAME_LINE=$(grep -m1 '^name:' SKILL.md || true)
          DESC_LINE=$(grep -m1 '^description:' SKILL.md || true)

          if [ -z "$NAME_LINE" ]; then
            echo "FAIL: SKILL.md frontmatter has no name: field"
            exit 1
          fi
          if [ -z "$DESC_LINE" ]; then
            echo "FAIL: SKILL.md frontmatter has no description: field"
            exit 1
          fi

          SKILL_NAME=$(echo "$NAME_LINE" | sed -E 's/^name:[[:space:]]*//' | tr -d '"' | xargs)
          DESC_VALUE=$(echo "$DESC_LINE" | sed -E 's/^description:[[:space:]]*//' | xargs)

          if [ -z "$SKILL_NAME" ]; then
            echo "FAIL: name: field is empty"
            exit 1
          fi
          if [ -z "$DESC_VALUE" ]; then
            echo "FAIL: description: field is empty"
            exit 1
          fi

          REPO_DIR=$(basename "$(pwd)")
          if [ "$SKILL_NAME" != "$REPO_DIR" ]; then
            echo "FAIL: name: ($SKILL_NAME) does not match repo directory name ($REPO_DIR)"
            exit 1
          fi

          if [ ! -f README.md ]; then
            echo "FAIL: README.md not found"
            exit 1
          fi

          if ! grep -q 'SKILL.md' README.md; then
            echo "FAIL: README.md does not link to SKILL.md"
            exit 1
          fi

          echo "OK: name=$SKILL_NAME, description set, README.md links to SKILL.md"
